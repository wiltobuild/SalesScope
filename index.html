<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta
      name="description"
      content="SalesBrief turns raw sales data into simple weekly reports."
    >
    <title>SalesBrief</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="app-shell">
      <header class="hero">
        <p class="eyebrow">Weekly sales reporting</p>
        <h1>SalesBrief</h1>
        <p class="intro">
          SalesBrief helps sales coordinators turn raw sales data into simple
          weekly reports.
        </p>
      </header>

      <section class="panel" aria-labelledby="upload-heading">
        <div class="section-heading">
          <span class="step-number" aria-hidden="true">1</span>
          <div>
            <h2 id="upload-heading">Upload sales data</h2>
            <p>Choose the sales data file you want to use.</p>
          </div>
        </div>

        <label class="upload-area" for="sales-file">
          <span class="upload-icon" aria-hidden="true">&#8593;</span>
          <span class="upload-title">Choose a sales data file</span>
          <span class="upload-hint">CSV or spreadsheet files</span>
          <input
            id="sales-file"
            name="sales-file"
            type="file"
            accept=".csv,.xls,.xlsx"
          >
        </label>
      </section>

      <section class="panel report-panel" aria-labelledby="report-heading">
        <div class="section-heading">
          <span class="step-number" aria-hidden="true">2</span>
          <div>
            <h2 id="report-heading">Weekly sales report</h2>
            <p>Your generated report will appear here later.</p>
          </div>
        </div>
        <div class="report-output" aria-live="polite"></div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
